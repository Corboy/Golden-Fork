<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gf-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE28A"/>
      <stop offset="40%" stop-color="#F2B83F"/>
      <stop offset="100%" stop-color="#C58514"/>
    </linearGradient>
    <linearGradient id="gf-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C58514" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Icon: Emblem with Fork -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Circle with gold outline -->
    <circle cx="50" cy="50" r="46" fill="#121212" stroke="url(#gf-gold-grad)" stroke-width="2.5" filter="url(#subtle-shadow)"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#gf-gold-grad)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Fork Glyph -->
    <g transform="translate(50, 50) scale(1.15) translate(-24, -24)" fill="url(#gf-gold-grad)">
      <!-- Prongs -->
      <path d="M19 8 C19 14, 21 18, 23 20 L23 38 C23 39.1 23.9 40 25 40 C26.1 40 27 39.1 27 38 L27 20 C29 18, 31 14, 31 8 L29 8 C29 13.5, 27.5 16.5, 26 17 L26 8 L24 8 L24 17 C22.5 16.5, 21 13.5, 21 8 Z"/>
    </g>
    
    <!-- Decorative side accents -->
    <circle cx="18" cy="50" r="1.5" fill="url(#gf-gold-grad)"/>
    <circle cx="82" cy="50" r="1.5" fill="url(#gf-gold-grad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- Primary Name -->
    <text x="0" y="44" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="36" font-weight="900" letter-spacing="4" fill="url(#gf-gold-grad)" filter="url(#subtle-shadow)">
      GOLDEN FORK
    </text>
    
    <!-- Secondary Subtitle -->
    <text x="3" y="70" font-family="'Poppins', 'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="6" fill="#EAEAEA" opacity="0.85">
      SWAHILI CUISINE • MIKOCHENI
    </text>
    
    <!-- Subtle separator bar -->
    <rect x="3" y="80" width="160" height="1.5" fill="url(#gf-gold-grad)" opacity="0.7"/>
  </g>
</svg>
