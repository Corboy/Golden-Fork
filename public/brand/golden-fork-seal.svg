<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Path for arched top text: GOLDEN FORK -->
    <path id="top-arch" d="M 50,200 A 150,150 0 0,1 350,200" fill="none"/>
    <!-- Path for arched bottom text: Swahili cuisine -->
    <path id="bottom-arch" d="M 345,200 A 145,145 0 0,1 55,200" fill="none"/>
    
    <linearGradient id="gf-gold-disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB326"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring with warm cream / gold border -->
  <circle cx="200" cy="200" r="192" fill="#FDFBF7" stroke="#A96E20" stroke-width="4"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#A96E20" stroke-width="1.5"/>

  <!-- Inner Gold Sun Circle -->
  <circle cx="200" cy="200" r="122" fill="url(#gf-gold-disc)" filter="url(#subtle-glow)"/>

  <!-- Arched Top Text: GOLDEN FORK -->
  <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="33" font-weight="900" letter-spacing="4" fill="#3D2912">
    <textPath href="#top-arch" startOffset="50%" text-anchor="middle">
      GOLDEN FORK
    </textPath>
  </text>

  <!-- Side Dot Ornaments -->
  <circle cx="48" cy="216" r="7" fill="#F59E0B"/>
  <circle cx="352" cy="216" r="7" fill="#F59E0B"/>

  <!-- Arched Bottom Text: Swahili cuisine -->
  <text font-family="'Brush Script MT', 'Dancing Script', 'Playfair Display', cursive, serif" font-size="34" font-weight="700" fill="#3D2912" font-style="italic">
    <textPath href="#bottom-arch" startOffset="50%" text-anchor="middle">
      Swahili cuisine
    </textPath>
  </text>

  <!-- Central Emblem: Chef Hat & Utensils inside Gold Circle -->
  <g transform="translate(200, 200)">
    <!-- Left Utensil: Spatula / Slotted Turner -->
    <g transform="translate(-76, -42) rotate(-18) scale(0.65)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-16" y="-35" width="32" height="42" rx="7" fill="none"/>
      <line x1="-7" y1="-26" x2="-7" y2="-7"/>
      <line x1="0" y1="-28" x2="0" y2="-5"/>
      <line x1="7" y1="-26" x2="7" y2="-7"/>
      <path d="M 0,7 L 0,65" stroke-width="6"/>
      <circle cx="0" cy="65" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Right Utensil: Slotted Spoon / Strainer -->
    <g transform="translate(76, -42) rotate(18) scale(0.65)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="-14" rx="18" ry="24" fill="none"/>
      <line x1="-7" y1="-24" x2="-7" y2="-4"/>
      <line x1="0" y1="-26" x2="0" y2="-2"/>
      <line x1="7" y1="-24" x2="7" y2="-4"/>
      <path d="M 0,10 L 0,65" stroke-width="6"/>
      <circle cx="0" cy="65" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Center White Chef Hat -->
    <g transform="translate(0, -6) scale(0.95)" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Hat Puffs -->
      <path d="M -45,18 C -58,10 -55,-18 -38,-26 C -40,-48 -15,-62 0,-52 C 15,-62 40,-48 38,-26 C 55,-18 58,10 45,18 Z" fill="#FFFFFF" fill-opacity="0.12"/>
      <!-- Hat Brim Ribbon Base -->
      <path d="M -42,28 C -20,38 20,38 42,28" stroke-width="7"/>
      <path d="M -45,18 C -20,28 20,28 45,18" stroke-width="7.5"/>
      <!-- Sparkle highlight on hat -->
      <path d="M 18, -4 Q 22, -18 30, -18 Q 24, -14 24, 0 Z" fill="#FFFFFF" stroke="none"/>
    </g>
  </g>
</svg>
